[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-finance"
version = "0.1.0"
description = "Financial lakehouse pipeline with MinIO, Polars, DuckDB, and dbt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gabriel Carmona" }
]
keywords = ["finance", "lakehouse", "minio", "duckdb", "polars", "dbt", "selic", "ipca"]

dependencies = [
    # Data Processing & Storage (S3 / MinIO)
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "duckdb>=1.0.0",
    "s3fs>=2024.1.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",

    # HTTP Requests & APIs (Banco Central do Brasil)
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "httpx>=0.27.0",

    # Transformation & Modeling
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",

    # Relational Database / Metadata
    "psycopg[binary]>=3.2.0",

    # Configuration & Environment
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # CLI & Utilities
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "faker>=30.0.0",
    "playwright>=1.40.0",
    "ruff>=0.3.0",
]

[tool.setuptools]
packages = []

