quantum_finance_dbt: 
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'lakehouse/quantum_finance.db'
    extensions:
      - httpfs
      - parquet
    settings: 
      s3_endpoint: 'localhost:9000'
        s3_access_key_id: 'lakehouse_admin'
        s3_secret_access_key: 'lakehouse_password'
        s3_use_ssl: false
        s3_url_style: 'path'